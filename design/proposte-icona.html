<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyBank · proposte icona app</title>
<style>
:root{--paper:#f3f0ea;--ink:#131211;--red:#e8431a;--mute:#9a958b;--hair:#2e2c29}
*{box-sizing:border-box}
body{margin:0;background:#121211;color:#edeae3;font:13px/1.5 system-ui,sans-serif;padding:24px 16px;max-width:900px;margin:auto}
h1{font:22px Georgia,serif;margin:0 0 4px}
p.n{color:var(--mute);margin:0 0 24px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:ui-monospace,monospace}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:0;border-top:2px solid #edeae3}
.v{padding:16px 12px 20px;border-bottom:1px solid var(--hair)}
.v h2{margin:0 0 2px;font:15px Georgia,serif}
.v small{display:block;color:var(--mute);margin-bottom:12px;font-size:12px}
.r{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px}
.i{overflow:hidden;background:#131211}
.i svg{display:block;width:100%;height:100%}
.sq{width:96px;height:96px}.ci{width:96px;height:96px;border-radius:50%}.sc{width:96px;height:96px;border-radius:30%}
.sm{width:48px;height:48px;border-radius:30%}
.tag{font:10px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center;margin-top:4px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<!-- 0 attuale: cassaforte -->
<symbol id="a0" viewBox="0 0 108 108"><rect width="108" height="108" fill="#131211"/><g transform="translate(-16 -16) scale(1)"><g transform="translate(0 0)"><rect x="40" y="36" width="52" height="50" fill="#E8431A"/><rect x="45" y="41" width="42" height="40" fill="#131211"/><circle cx="66" cy="61" r="11" fill="none" stroke="#F3F0EA" stroke-width="4"/><rect x="64" y="52" width="4" height="9" fill="#F3F0EA"/><rect x="46" y="86" width="8" height="5" fill="#E8431A"/><rect x="78" y="86" width="8" height="5" fill="#E8431A"/></g></g></symbol>
<!-- 1 M a blocchi -->
<symbol id="a1" viewBox="0 0 108 108"><rect width="108" height="108" fill="#131211"/><rect x="30" y="34" width="12" height="42" fill="#F3F0EA"/><rect x="66" y="34" width="12" height="42" fill="#F3F0EA"/><rect x="42" y="34" width="12" height="16" fill="#F3F0EA"/><rect x="54" y="34" width="12" height="16" fill="#F3F0EA"/><rect x="48" y="50" width="12" height="14" fill="#E8431A"/><rect x="30" y="80" width="48" height="4" fill="#E8431A"/></symbol>
<!-- 2 mattoncini del budget + ritmo -->
<symbol id="a2" viewBox="0 0 108 108"><rect width="108" height="108" fill="#131211"/><rect x="28" y="34" width="52" height="8" fill="#F3F0EA"/><rect x="28" y="50" width="38" height="8" fill="#F3F0EA"/><rect x="28" y="66" width="24" height="8" fill="#F3F0EA"/><rect x="54" y="28" width="4" height="52" fill="#E8431A"/></symbol>
<!-- 3 € serif su vermiglio -->
<symbol id="a3" viewBox="0 0 108 108"><rect width="108" height="108" fill="#E8431A"/><text x="54" y="73" font-family="Georgia,'Times New Roman',serif" font-size="58" font-weight="700" text-anchor="middle" fill="#131211">€</text></symbol>
<!-- 4 carta con M serif e punto rosso -->
<symbol id="a4" viewBox="0 0 108 108"><rect width="108" height="108" fill="#F3F0EA"/><text x="50" y="72" font-family="Georgia,'Times New Roman',serif" font-size="56" font-weight="700" text-anchor="middle" fill="#131211">M</text><rect x="72" y="62" width="10" height="10" fill="#E8431A"/></symbol>
<!-- 5 solo manopola cassaforte -->
<symbol id="a5" viewBox="0 0 108 108"><rect width="108" height="108" fill="#131211"/><circle cx="54" cy="54" r="26" fill="none" stroke="#E8431A" stroke-width="8"/><circle cx="54" cy="54" r="12" fill="none" stroke="#F3F0EA" stroke-width="5"/><rect x="51" y="30" width="6" height="14" fill="#F3F0EA"/></symbol>
<!-- 6 quadrato in quadrato con segno -->
<symbol id="a6" viewBox="0 0 108 108"><rect width="108" height="108" fill="#131211"/><rect x="30" y="30" width="48" height="48" fill="none" stroke="#F3F0EA" stroke-width="5"/><rect x="42" y="42" width="24" height="24" fill="#E8431A"/></symbol>
<!-- 7 barre che crescono (movimenti) su rosso -->
<symbol id="a7" viewBox="0 0 108 108"><rect width="108" height="108" fill="#E8431A"/><rect x="28" y="58" width="12" height="22" fill="#131211"/><rect x="48" y="46" width="12" height="34" fill="#131211"/><rect x="68" y="30" width="12" height="50" fill="#131211"/></symbol>
<!-- 8 saldo: M-tratto carta con filetto -->
<symbol id="a8" viewBox="0 0 108 108"><rect width="108" height="108" fill="#131211"/><path d="M30 78V34h8l16 24 16-24h8v44" fill="none" stroke="#F3F0EA" stroke-width="7" stroke-linejoin="miter"/><rect x="30" y="86" width="48" height="3" fill="#E8431A"/></symbol>
</defs></svg>

<h1>Proposte icona app</h1>
<p class="n">Mockup · solo tema scuro · quadrata, cerchio, squircle e 48 px</p>
<div class="g" id="g"></div>
<script>
const v=[
["0 · Attuale","La cassaforte in uso (riferimento)."],
["1 · M a blocchi","Monogramma di mattoni con un segno rosso al centro e filetto di base."],
["2 · Mattoncini","Le barre del Budget che si accorciano e il segno rosso del ritmo."],
["3 · Euro su vermiglio","Fondo rosso pieno, € serif inchiostro: massimo contrasto sulla home."],
["4 · Carta","Fondo carta, M serif inchiostro e un punto rosso: unica icona chiara."],
["5 · Manopola","Solo la manopola della cassaforte, anello rosso e indice chiaro."],
["6 · Quadrato nel quadrato","Geometria minima: cornice carta e nucleo rosso."],
["7 · Barre su rosso","Tre barre che crescono, inchiostro su vermiglio."],
["8 · M tratto","M a tratto spesso carta su inchiostro, con filetto rosso sotto."]];
const g=document.getElementById('g');
v.forEach((x,i)=>{const u=`<svg><use href="#a${i}"/></svg>`;
g.insertAdjacentHTML('beforeend',`<div class="v"><h2>${x[0]}</h2><small>${x[1]}</small><div class="r">
<div><div class="i sq">${u}</div><div class="tag">piena</div></div>
<div><div class="i ci">${u}</div><div class="tag">cerchio</div></div>
<div><div class="i sc">${u}</div><div class="tag">squircle</div></div>
<div><div class="i sm">${u}</div><div class="tag">48 px</div></div></div></div>`)});
</script></body></html>
